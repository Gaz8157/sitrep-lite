name: Build Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build

      - name: Package release zip
        run: |
          mkdir -p release/SitrepLite/frontend
          cp -r sitrep_lite release/SitrepLite/
          cp -r frontend/dist release/SitrepLite/frontend/
          cp pyproject.toml release/SitrepLite/
          cp build/run.bat release/SitrepLite/
          cd release && zip -r ../SitrepLite-${{ github.ref_name || 'dev' }}.zip SitrepLite/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SitrepLite
          path: SitrepLite-*.zip

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SitrepLite-*.zip
          generate_release_notes: true
