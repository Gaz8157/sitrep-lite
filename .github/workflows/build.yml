name: Build Windows Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python deps
        run: |
          pip install uv
          uv venv
          uv pip install -e ".[build]"

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build exe with PyInstaller
        run: |
          uv run pyinstaller build/sitrep-lite.spec --distpath build/out --workpath build/tmp --clean

      - name: Create zip
        run: |
          cd build/out
          Compress-Archive -Path SitrepLite -DestinationPath ../SitrepLite-${{ github.ref_name || 'dev' }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SitrepLite
          path: build/SitrepLite-*.zip

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/SitrepLite-*.zip
          generate_release_notes: true
